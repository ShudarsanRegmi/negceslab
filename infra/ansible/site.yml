---
- name: Provision and Deploy NegcesLab Staging Environment
  hosts: all
  become: yes
  vars:
    target_user: "negces-staging"
    repo_url: "https://github.com/ShudarsanRegmi/negceslab.git"
    git_branch: "feature/cicd-pipeline"
    project_dir: "/home/{{ target_user }}/negceslab"
    domain_name: "negceslab2.shudarsanregmi.com.np"
    ssl_email: "sudoerson@gmail.com"

  tasks:
    - name: Enable Ubuntu Universe Repository
      apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu noble universe"
        state: present
      tags: [setup]

    - name: Update apt cache and install required system packages
      apt:
        name:
          - git
          - curl
          - make
          - acl
          - nginx
          - podman
          - podman-compose
          - containernetworking-plugins
          - python3-pip
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes
      tags: [setup]

    - name: Enable systemd lingering for target user
      command: "loginctl enable-linger {{ target_user }}"
      changed_when: false
      tags: [setup]

    - name: Enable and start podman.socket service for target user
      systemd:
        name: podman.socket
        scope: user
        state: started
        enabled: yes
      become_user: "{{ target_user }}"
      tags: [setup]

    - name: Ensure target user directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'
      tags: [setup]

    - name: Clone or update NegcesLab repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ git_branch }}"
        force: yes
      become_user: "{{ target_user }}"
      tags: [deploy, build, seed]

    - name: Deploy Nginx Reverse Proxy Configuration
      template:
        src: templates/nginx-staging.conf.j2
        dest: /etc/nginx/sites-available/negceslab-staging
        mode: '0644'
      tags: [nginx]

    - name: Enable Nginx site configuration
      file:
        src: /etc/nginx/sites-available/negceslab-staging
        dest: /etc/nginx/sites-enabled/negceslab-staging
        state: link
      tags: [nginx]

    - name: Remove default Nginx site configuration
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      tags: [nginx]

    - name: Test and restart Nginx service
      systemd:
        name: nginx
        state: restarted
        enabled: yes
      tags: [nginx]

    - name: Upload local uncommitted server environment file to remote VM
      copy:
        src: "../../server/.env.staging"
        dest: "{{ project_dir }}/server/.env"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0600'
      tags: [deploy, build, seed]

    - name: Upload local uncommitted client environment file to remote VM
      copy:
        src: "../../client/.env.staging"
        dest: "{{ project_dir }}/client/.env"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0600'
      tags: [deploy, build]

    - name: Upload local uncommitted Firebase service account key to remote VM
      copy:
        src: "../../server/config/serviceAccountKey.staging.json"
        dest: "{{ project_dir }}/server/config/serviceAccountKey.staging.json"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0600'
      tags: [deploy, build, seed]

    - name: Build frontend React static dist bundle using Podman
      command: make build-frontend
      args:
        chdir: "{{ project_dir }}"
      become_user: "{{ target_user }}"
      tags: [build, deploy]

    - name: Grant www-data traverse permissions on target user home directory via ACL
      acl:
        path: "/home/{{ target_user }}"
        entity: www-data
        etype: user
        permissions: x
        state: present
      tags: [build, deploy, nginx]

    - name: Grant www-data traverse permissions on negceslab directory via ACL
      acl:
        path: "{{ project_dir }}"
        entity: www-data
        etype: user
        permissions: x
        state: present
      tags: [build, deploy, nginx]

    - name: Grant www-data traverse permissions on client directory via ACL
      acl:
        path: "{{ project_dir }}/client"
        entity: www-data
        etype: user
        permissions: x
        state: present
      tags: [build, deploy, nginx]

    - name: Grant www-data read/execute permissions recursively on frontend dist directory via ACL
      acl:
        path: "{{ project_dir }}/client/dist"
        entity: www-data
        etype: user
        permissions: rx
        recursive: yes
        state: present
      tags: [build, deploy, nginx]

    - name: Prune stale podman networks
      command: podman network prune -f
      become_user: "{{ target_user }}"
      ignore_errors: yes
      tags: [deploy]

    - name: Boot Podman Compose stack (MongoDB, Backend, Telemetry)
      command: podman-compose --env-file server/.env up -d
      args:
        chdir: "{{ project_dir }}"
      become_user: "{{ target_user }}"
      tags: [deploy, seed]

    - name: Wait for MongoDB container to become ready
      command: podman exec mongodb mongosh --eval "db.adminCommand('ping')"
      register: mongo_ping
      until: mongo_ping.rc == 0
      retries: 20
      delay: 5
      become_user: "{{ target_user }}"
      ignore_errors: yes
      tags: [deploy, seed]

    - name: Execute Database Seed Script for Staging Accounts
      command: podman exec backend npm run seed:staging
      args:
        chdir: "{{ project_dir }}"
      register: seed_result
      until: seed_result.rc == 0
      retries: 5
      delay: 5
      become_user: "{{ target_user }}"
      tags: [seed]

    - name: Obtain Let's Encrypt SSL Certificate via Certbot (if domain is configured)
      command: "certbot certonly --webroot -w {{ project_dir }}/client/dist -d {{ domain_name }} --non-interactive --agree-tos -m {{ ssl_email }}"
      when: domain_name != "_" and domain_name != ""
      ignore_errors: yes
      tags: [ssl]

    - name: Configure Nginx SSL certificate bindings if certs exist
      block:
        - name: Check if SSL certificate exists
          stat:
            path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
          register: cert_stat

        - name: Insert SSL listen directives into Nginx site configuration
          blockinfile:
            path: /etc/nginx/sites-available/negceslab-staging
            insertafter: "server_name"
            block: |
              listen 443 ssl;
              listen [::]:443 ssl;
              ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
          when: cert_stat.stat.exists
      when: domain_name != "_" and domain_name != ""
      ignore_errors: yes
      tags: [ssl]

    - name: Reload Nginx service to load newly generated SSL certificates
      systemd:
        name: nginx
        state: reloaded
      when: domain_name != "_" and domain_name != ""
      ignore_errors: yes
      tags: [ssl]
