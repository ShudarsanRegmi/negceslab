version: "3.8"

services:
  mongo:
    image: docker.io/library/mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
    env_file:
      - ./server/.env
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - ./server/.env
    ports:
      - "5001:5000"
    volumes:
      - ./server/logs:/var/log/negceslab
    depends_on:
      mongo:
        condition: service_healthy

  frontend-builder:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: output
    container_name: frontend-builder
    volumes:
      - ./client/dist:/output
    restart: "no"

  loki:
    image: docker.io/grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  promtail:
    image: docker.io/grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      - ./server/logs:/var/log/negceslab
      - ./config/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: docker.io/grafana/grafana:10.2.2
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

  prometheus:
    image: docker.io/prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  node_exporter:
    image: docker.io/prom/node-exporter:v1.7.0
    container_name: node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  podman_exporter:
    image: quay.io/navidys/prometheus-podman-exporter:latest
    container_name: podman_exporter
    command:
      - '--collector.enable-all'
    environment:
      - CONTAINER_HOST=unix:///run/user/1003/podman/podman.sock
    volumes:
      - /run/user/1003/podman/podman.sock:/run/user/1003/podman/podman.sock
    ports:
      - "9882:9882"
    restart: unless-stopped

  mongodb_exporter:
    image: docker.io/percona/mongodb_exporter:0.40.0
    container_name: mongodb_exporter
    command:
      - '--collect-all'
    env_file:
      - ./server/.env
    ports:
      - "9216:9216"
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
