server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: negceslab-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: negceslab
          __path__: /var/log/negceslab/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            category: category
            message: message
      - labels:
          level:
          category:
