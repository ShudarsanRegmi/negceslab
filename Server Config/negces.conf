ProxyPreserveHost On

# --- WebSocket proxy (Must be declared BEFORE standard HTTP ProxyPass) ---
ProxyPass        /negcesapi/ws/  ws://localhost:5001/ws/
ProxyPassReverse /negcesapi/ws/  ws://localhost:5001/ws/

# --- API proxy ---
ProxyPass        /negcesapi/  http://localhost:5001/
ProxyPassReverse /negcesapi/  http://localhost:5001/

# --- Static frontend ---
Alias /negces/ "/USERHOME/negceslab/client/dist/"

<Directory "/USERHOME/negceslab/client/dist">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
</Directory>