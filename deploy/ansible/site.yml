---
- name: Provision and Deploy NegcesLab Staging Environment
  hosts: all
  become: yes
  vars:
    target_user: "negces-staging"
    repo_url: "https://github.com/ShudarsanRegmi/negceslab.git"
    git_branch: "feature/cicd-pipeline"
    project_dir: "/home/{{ target_user }}/negceslab"
    domain_name: "_"

  tasks:
    - name: Enable Ubuntu Universe Repository
      apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu jammy universe"
        state: present
      tags: [setup]

    - name: Update apt cache and install required system packages
      apt:
        name:
          - git
          - curl
          - make
          - acl
          - nginx
          - podman
          - containernetworking-plugins
          - python3-pip
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes
      tags: [setup]

    - name: Install podman-compose via pip
      pip:
        name: podman-compose
        state: present
      tags: [setup]

    - name: Enable systemd lingering for target user
      command: "loginctl enable-linger {{ target_user }}"
      changed_when: false
      tags: [setup]

    - name: Enable and start podman.socket service for target user
      systemd:
        name: podman.socket
        scope: user
        state: started
        enabled: yes
      become_user: "{{ target_user }}"
      tags: [setup]

    - name: Ensure target user directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'
      tags: [setup]

    - name: Clone or update NegcesLab repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ git_branch }}"
        force: yes
      become_user: "{{ target_user }}"
      tags: [deploy, build, seed]

    - name: Deploy Nginx Reverse Proxy Configuration
      template:
        src: templates/nginx-staging.conf.j2
        dest: /etc/nginx/sites-available/negceslab-staging
        mode: '0644'
      tags: [nginx]

    - name: Enable Nginx site configuration
      file:
        src: /etc/nginx/sites-available/negceslab-staging
        dest: /etc/nginx/sites-enabled/negceslab-staging
        state: link
      tags: [nginx]

    - name: Remove default Nginx site configuration
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      tags: [nginx]

    - name: Test and restart Nginx service
      systemd:
        name: nginx
        state: restarted
        enabled: yes
      tags: [nginx]

    - name: Ensure environment files exist from templates
      copy:
        src: "{{ project_dir }}/server/.env.example"
        dest: "{{ project_dir }}/server/.env"
        remote_src: yes
        force: yes
      become_user: "{{ target_user }}"
      tags: [deploy, build, seed]

    - name: Build frontend React static dist bundle using Podman
      command: make build-frontend
      args:
        chdir: "{{ project_dir }}"
      become_user: "{{ target_user }}"
      tags: [build, deploy]

    - name: Grant www-data traverse permissions on target user home directory via ACL
      acl:
        path: "/home/{{ target_user }}"
        entity: www-data
        etype: user
        permissions: rx
        state: present
      tags: [build, deploy, nginx]

    - name: Grant www-data read/execute permissions recursively on frontend dist directory via ACL
      acl:
        path: "{{ project_dir }}/client/dist"
        entity: www-data
        etype: user
        permissions: rx
        recursive: yes
        state: present
      tags: [build, deploy, nginx]

    - name: Prune stale podman networks
      command: podman network prune -f
      become_user: "{{ target_user }}"
      ignore_errors: yes
      tags: [deploy]

    - name: Boot Podman Compose stack (MongoDB, Backend, Telemetry)
      command: podman-compose --env-file server/.env up -d
      args:
        chdir: "{{ project_dir }}"
      become_user: "{{ target_user }}"
      tags: [deploy, seed]

    - name: Wait for MongoDB container to become ready
      command: podman exec mongodb mongosh --eval "db.adminCommand('ping')"
      register: mongo_ping
      until: mongo_ping.rc == 0
      retries: 15
      delay: 3
      become_user: "{{ target_user }}"
      ignore_errors: yes
      tags: [deploy, seed]

    - name: Execute Database Seed Script for Staging Accounts
      command: podman exec backend npm run seed:staging
      args:
        chdir: "{{ project_dir }}"
      become_user: "{{ target_user }}"
      tags: [seed]
